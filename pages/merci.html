<main class="main-content" id="main-content" role="main">

    <!-- 1. Breadcrumb -->
    <div class="services-breadcrumb-wrapper">
        <div class="container">
            <nav class="breadcrumb" aria-label="Fil d'Ariane">
                <ol class="breadcrumb-list" role="list">
                    <li class="breadcrumb-item"><a href="index.html" class="breadcrumb-link">Accueil</a></li>
                    <li class="breadcrumb-separator" aria-hidden="true">
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </li>
                    <li class="breadcrumb-item breadcrumb-item-active" aria-current="page"><span>Demande transmise</span></li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- 2. Section Confirmation -->
    <section class="section" id="confirmation-envoi">
        <div class="container" style="max-width: 720px; text-align: center;">
            <div class="card" style="padding: var(--spacing-48px) var(--spacing-24px);">
                <div style="width: 64px; height: 64px; border-radius: var(--radius-circle); background-color: hsla(var(--color-success-h), var(--color-success-s), var(--color-success-l), 0.1); color: var(--color-success); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--spacing-24px) auto;">
                    <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>

                <h1 style="font-family: var(--font-heading); font-size: var(--font-size-3xl); font-weight: 800; color: var(--color-text-primary); margin-bottom: var(--spacing-16px);">
                    Demande bien reçue !
                </h1>

                <p style="font-size: var(--font-size-lg); color: var(--color-text-secondary); line-height: 1.6; margin-bottom: var(--spacing-24px);">
                    Merci de votre confiance. Votre demande d'offre a été transmise à notre équipe. Nous étudions votre projet et vous recontacterons avec une étude détaillée <strong>sous 72 heures maximum</strong>.
                </p>

                <div style="display: flex; justify-content: center; gap: var(--spacing-16px); flex-wrap: wrap;">
                    <a href="index.html" class="btn btn-primary">Retourner à l'accueil</a>
                    <a href="portfolio.html" class="btn btn-outline">Découvrir nos réalisations</a>
                </div>
            </div>
        </div>
    </section>

</main>
